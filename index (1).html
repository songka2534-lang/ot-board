<style>
html,body{margin:0}[hidden]{display:none!important}
body{padding-top:env(safe-area-inset-top,0px)}

/* Layout: phone-first calendar app; one column up to 560px, top bar + bottom tab bar, bottom sheet for editing a day */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#EEF2F6; --line:#E3EAF0; --line2:#CBD3DB;
  --fg:#15202B; --fg2:#3A4652; --muted:#5B6672; --faint:#A3ADB7;
  --me:#0379B8; --me-ink:#035E8F; --me-soft:#E1F3FC; --me-mid:#7CC4EA; --me-tint:#EEF8FD;
  --pt:#1E3A8A; --pt-ink:#1E3A8A; --pt-soft:#E4E9F7; --pt-mid:#8A9BD1; --pt-tint:#F1F4FB;
  --hol:#6A2E8C; --hol-soft:#F3EAF8; --hol-line:#CDB3DD;
  --good:#1B7A3E; --good-soft:#E6F4EA; --bad:#B42318; --bad-soft:#FDECEC;
  --on-ac:#FFFFFF; --ink:#15202B; --on-ink:#FFFFFF; --scrim:rgba(12,18,26,.45);
  color-scheme:light;
  --font:'IBM Plex Sans Thai','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;
}


*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
.p-me{--ac:var(--me);--ac-ink:var(--me-ink);--ac-soft:var(--me-soft);--ac-mid:var(--me-mid);--ac-tint:var(--me-tint)}
.p-pt{--ac:var(--pt);--ac-ink:var(--pt-ink);--ac-soft:var(--pt-soft);--ac-mid:var(--pt-mid);--ac-tint:var(--pt-tint)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac,var(--me));outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.bar .ttl{font-size:20px;font-weight:700}
.seg{display:grid;gap:4px;background:var(--sunk);border:1px solid var(--line);padding:4px;border-radius:12px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--fg2);font-size:14px;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--on-ac);font-weight:600}
.pp{grid-template-columns:repeat(2,minmax(0,1fr))}
.pp button.me[aria-pressed="true"]{background:var(--me);color:var(--on-ac)} .pp button.pt[aria-pressed="true"]{background:var(--pt);color:var(--on-ac)}
.cyc{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cyc .mid{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.cyc .mid b{font-size:18px} .cyc .mid span{font-size:12px;color:var(--muted)}
.ibtn{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:20px;flex:none}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.kc span{font-size:11px;color:var(--muted)} .kc b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc.ac{background:var(--ac);border-color:var(--ac);color:var(--on-ac)} .kc.ac span{color:var(--on-ac);opacity:.85}
.dows{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-size:11px;color:var(--muted);text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cell{height:56px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 0;min-width:0;position:relative}
.cell .n{font-size:14px;font-weight:600;line-height:1.1}
.cell.off{background:var(--sunk)} .cell.off .n{color:var(--muted);font-weight:500}
.cell.hd{background:var(--hol-soft)} .cell.hd .n{color:var(--hol)}
.cell.wk{background:var(--ac-soft)}
.cell.off,.cell.hd,.cell.wk{border-color:transparent}
.cell.blank{background:transparent;border-color:transparent;cursor:default} .cell.blank .n{color:var(--faint);font-weight:400}
.cell.today{box-shadow:inset 0 0 0 2px var(--ac)}
.cell .n.mo{font-size:12px;color:var(--ac-ink);font-weight:700}
.b{font-size:11px;font-weight:700;line-height:17px;border-radius:6px;padding:0 6px;background:var(--ac);color:var(--on-ac);max-width:94%;overflow:hidden;white-space:nowrap}
.b.h{background:var(--hol);color:var(--on-ac)}
.b.f{background:transparent;color:var(--ac-ink);border:1px dashed var(--ac-mid);line-height:15px;font-weight:500}
.b.z{background:transparent;color:var(--faint);font-weight:500}
.b.t{background:transparent;color:var(--ac-ink);font-weight:600}
.b.x{background:var(--bad-soft);color:var(--bad)}
.b.hn{background:transparent;color:var(--hol);font-weight:500;font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:16px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.qh{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.qh button,.hours button{min-height:48px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);font-size:16px;font-weight:600;padding:0 2px}
.qh button.w,.hours button.w{font-size:13px;font-weight:500;color:var(--fg2)}
.qh button[aria-pressed="true"],.hours button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.hours{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hours button{min-height:56px;font-size:18px;border-radius:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:44px;border:0;border-radius:12px;background:var(--ac);color:var(--on-ac);font-weight:600;padding:0 16px}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line2);font-weight:500}
.btn.soft{background:var(--sunk);color:var(--fg2);font-weight:500;border:1px solid var(--line)}
.btn.link{background:none;color:var(--ac-ink);padding:0 4px;font-weight:500;text-decoration:underline}
.calc{background:var(--ac-tint);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--fg2)}
.line{display:flex;justify-content:space-between;gap:10px}
.line > span:first-child{min-width:0}
.total{border-top:1px solid var(--line2);padding-top:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600;color:var(--fg)}
.big{font-size:22px;font-weight:700;color:var(--ac-ink)}
.sec{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);padding-top:4px}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.li:first-child{border-top:0}
.li.b2{border-top-color:var(--line2);font-weight:700}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{font-size:16px;color:var(--fg);padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);min-width:0;width:100%}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fields .full{grid-column:1/-1}
.note{font-size:13px;color:var(--fg2);background:var(--sunk);border-radius:10px;padding:10px 12px}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--sunk)}
.bars{display:flex;align-items:flex-end;gap:5px;height:136px;border-bottom:1px solid var(--line2)}
.bars .col{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.bars .col div:first-child{border-radius:3px 3px 0 0}
.months{display:flex;gap:5px;font-size:10px;color:var(--muted);text-align:center}
.months span{flex:1 1 0}
.months span.now{color:var(--me-ink);font-weight:700}
.h-me{background:repeating-linear-gradient(135deg,var(--me-mid) 0 3px,var(--me-soft) 3px 6px)}
.h-pt{background:repeating-linear-gradient(135deg,var(--pt-mid) 0 3px,var(--pt-soft) 3px 6px)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pc{text-decoration:none;color:var(--fg);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);text-align:left}
.pc span{font-size:12px;color:var(--muted)} .pc b{font-size:18px} .pc small{font-size:11px;color:var(--fg2)}
.hero b{font-size:32px;letter-spacing:-.01em;line-height:1.15}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--muted);text-align:right;padding:7px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 5px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.sum td{font-weight:700;background:var(--ac-tint)}
.tw{overflow-x:auto;margin-inline:-4px}
details > summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:32px;gap:8px}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"แสดง";font-size:13px;color:var(--muted);font-weight:500}
details[open] > summary::after{content:"ซ่อน"}
.xrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--line);font-size:14px}
.xbtn{border:0;background:none;color:var(--muted);min-width:44px;min-height:40px;font-size:13px}
.pill-good{background:var(--good-soft);color:var(--good);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill{background:var(--sunk);color:var(--fg2);border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
.good{color:var(--good)} .badc{color:var(--bad)}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;background:var(--bad-soft);color:var(--bad)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabbar nav{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
.tabbar a{text-decoration:none;min-width:68px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
.tabbar a[aria-current="page"]{color:var(--ac-ink);font-weight:700}
.tabbar svg{width:22px;height:22px}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet .in{max-width:560px;margin:0 auto;padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line2)}
.x{width:44px;height:44px;border:0;border-radius:22px;background:var(--sunk);font-size:16px;color:var(--fg2);flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (min-width:600px){.cell{height:64px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* OT hours by type */
.htiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ht{background:var(--ac-tint);border:1px solid var(--line);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.ht span{font-size:11px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:4px} .ht b{font-size:16px;white-space:nowrap} .ht b small{font-size:11px;font-weight:500}
.ht em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht.no{background:none;border-style:dashed} .ht.no b,.ht.no em{color:var(--faint)}
.sq{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.hbig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap} .hbig b{font-size:32px;line-height:1.1;letter-spacing:-.01em}
.hh,.hr{display:grid;grid-template-columns:38px minmax(0,1fr) 76px 34px;align-items:center;gap:8px}
.hh{font-size:11px;color:var(--muted);padding:0 6px 2px} .hh span:nth-child(n+3),.hr .tr{text-align:right}
.hr{width:100%;min-height:36px;padding:3px 6px;border:0;border-top:1px solid var(--line);background:none;color:var(--fg);font-size:13px;text-align:left;border-radius:0}
.hr .mo{color:var(--muted)} .hr.now .mo{color:var(--ac-ink);font-weight:700} .hr b{font-weight:600;white-space:nowrap} .hr .hd{font-size:12px;color:var(--muted)}
.hr.op{background:var(--ac-tint);border-radius:8px 8px 0 0;border-top-color:transparent}
.hbar{height:12px;border-radius:6px;background:var(--sunk);display:flex;overflow:hidden} .hbar i{display:block;height:100%}
.hdet{background:var(--ac-tint);padding:0 6px 8px 52px;border-radius:0 0 8px 8px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--fg2)}
.hdet span{display:inline-flex;align-items:center;gap:4px}
.mx{font-size:10px;color:var(--ac-ink)}
/* editable expenses */
.xe{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 4px;border:0;border-top:1px solid var(--line);background:none;color:var(--fg);font-size:14px;text-align:left;border-radius:0}
.xe .am{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap} .xe svg{width:14px;height:14px;color:var(--muted);flex:none}
.tag{font-size:10.5px;color:var(--ac-ink);background:var(--ac-soft);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:500;white-space:nowrap}
.stepper{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:8px}
.stepper button{min-height:52px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);font-size:14px;color:var(--fg2)}
.field .stepper input{min-height:52px;border:2px solid var(--ac);border-radius:12px;text-align:center;font-size:22px;font-weight:700}
.radio{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);font-size:14px;color:var(--fg);text-align:left;width:100%}
.radio::before{content:'';display:block;flex:none;box-sizing:border-box;width:18px;height:18px;border-radius:50%;border:2px solid var(--faint)}
.radio[aria-pressed="true"]{border:2px solid var(--ac);background:var(--ac-tint)} .radio[aria-pressed="true"]::before{border:5px solid var(--ac);background:var(--surface)}
.btn.danger{background:none;color:var(--bad);text-decoration:underline;font-weight:500}
</style>

<body>
<div id="app" class="p-me"><div class="app"><div class="card"><b>OT Board</b><span class="muted">กำลังโหลดข้อมูล…</span></div></div></div>

<script>
// CALC-START
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const r2=x=>Math.round(x*100)/100;

const DEF_HOL=[['2026-10-13','วันนวมินทรมหาราช'],['2026-10-23','วันปิยมหาราช'],['2026-12-05','วันพ่อแห่งชาติ'],['2026-12-07','ชดเชยวันพ่อแห่งชาติ'],['2026-12-10','วันรัฐธรรมนูญ'],['2026-12-31','วันสิ้นปี']];
const DEF={
  me:{salaryFrom:[{ym:'2026-01',v:23045},{ym:'2026-04',v:24660}],cycleStart:16,travel:500,lunch:30,otMeal:30,
      pfRate:15,sso:875,loan:390,otherDeduct:0,extraTaxable:7000,taxAllowance:0,holidays:DEF_HOL,expenses:[]},
  partner:{wage:400,cycleStart:21,ot15:1.5,ot3:3,travel:25,meal:35,skill:45,diligence:300,loseOn:['sick'],ssoRate:5,ssoCap:875,
      holMult:2,paidHoliday:true,holidays:DEF_HOL}
};
const SCN={low:0.85,mid:1,high:1.1};

function cfg(S,p){return Object.assign({},DEF[p],S.settings[p]||{})}
function holMap(S,p){const m={};for(const h of (cfg(S,p).holidays||[]))m[h[0]]=h[1]||'วันหยุด';return m}
function keyOf(p,y,m){return `${p}-${y}-${pad(m)}`}
function splitKey(k){const a=k.split('-');return {p:a[0],y:+a[1],m:+a[2]}}
function cycleRange(S,k){const {p,y,m}=splitKey(k);const cs=cfg(S,p).cycleStart;return {start:new Date(y,m-2,cs),end:new Date(y,m-1,cs-1)}}
function cycleOf(S,p,d){const cs=cfg(S,p).cycleStart;let y=d.getFullYear(),m=d.getMonth()+1;if(d.getDate()>=cs){m++;if(m>12){m=1;y++}}return keyOf(p,y,m)}
function datesIn(S,k){const {start,end}=cycleRange(S,k);const out=[];for(let d=start;d<=end;d=addDays(d,1))out.push(ymd(d));return out}
function shiftKey(k,n){const {p,y,m}=splitKey(k);const t=new Date(y,m-1+n,1);return keyOf(p,t.getFullYear(),t.getMonth()+1)}
function yearKeys(p,y){return Array.from({length:12},(_,i)=>keyOf(p,y,i+1))}
function isOffDay(S,p,ds){const d=parseD(ds).getDay();if(holMap(S,p)[ds])return true;return p==='me'?(d===0||d===6):d===0}
function salaryFor(S,k){const {y,m}=splitKey(k);const ym=`${y}-${pad(m)}`;let v=0;for(const s of cfg(S,'me').salaryFrom.slice().sort((a,b)=>a.ym<b.ym?-1:1))if(s.ym<=ym)v=s.v;return v||cfg(S,'me').salaryFrom[0].v}
function getDay(S,p,ds){const k=cycleOf(S,p,parseD(ds));const c=S.cycles[k];return c&&c.days?c.days[ds]:undefined}

/* ---------- me ---------- */
function meDay(S,e,sal){const h=sal/240,d=sal/30,c=cfg(S,'me');
  if(!e)return null;
  if(e.s==='work'){const o=+e.ot||0;return {otPay:o*h*1.5,meal:(+c.lunch||0)+(o>0?(+c.otMeal||0):0),hours:o,otDays:o>0?1:0,otH:o,holDays:0,h3:0}}
  if(e.s==='hol'){const o=+e.ot||0;return {otPay:d+o*h*3,meal:o>0?(+c.otMeal||0):0,hours:8+o,otDays:0,otH:0,holDays:1,h3:o}}
  return {otPay:0,meal:0,hours:0,otDays:0,otH:0,holDays:0,h3:0}}
function meCounts(S,k){const c=S.cycles[k];if(!c)return null;
  const ds=datesIn(S,k);let wd=0,od=0;for(const x of ds){if(isOffDay(S,'me',x))od++;else wd++}
  if(c.actual&&c.actual.otDays!=null)return {wd,od,otDays:c.actual.otDays,otH:c.actual.otHours,holDays:c.actual.holDays,h3:c.actual.h3||0};
  if(c.days){let a={wd:0,od:0,otDays:0,otH:0,holDays:0,h3:0};const sal=salaryFor(S,k);const keys=Object.keys(c.days).sort();if(!keys.length)return null;const last=keys[keys.length-1];
    for(const x of ds){if(x>last)break;const e=c.days[x];const off=isOffDay(S,'me',x);if(!e){if(off)a.od++;continue}if(off)a.od++;else a.wd++;const r=meDay(S,e,sal);a.otDays+=r.otDays;a.otH+=r.otH;a.holDays+=r.holDays;a.h3+=r.h3}
    return a}
  return null}
function meStats(S,curKey){let wd=0,od=0,otDays=0,otH=0,hol=0,h3=0,n=0;
  for(let i=1;i<=6&&n<3;i++){const k=shiftKey(curKey,-i);const s=meCounts(S,k);if(!s)continue;n++;wd+=s.wd;od+=s.od;otDays+=s.otDays;otH+=s.otH;hol+=s.holDays;h3+=s.h3}
  const cur=meCounts(S,curKey);if(cur&&!(S.cycles[curKey]||{}).actual){wd+=cur.wd;od+=cur.od;otDays+=cur.otDays;otH+=cur.otH;hol+=cur.holDays;h3+=cur.h3}
  if(!wd)return {pOt:0.8,avgOt:2.5,pHol:0.35,avgH3:0.5};
  return {pOt:otDays/wd,avgOt:otDays?otH/otDays:2.5,pHol:od?hol/od:0,avgH3:hol?h3/hol:0}}
function meExpected(S,ds,sal,st,f){const h=sal/240,d=sal/30,c=cfg(S,'me');
  if(isOffDay(S,'me',ds)){const p=st.pHol*f;return {otPay:p*(d+st.avgH3*h*3),meal:p*Math.min(1,st.avgH3/2.5)*(+c.otMeal||0),hours:p*(8+st.avgH3),likely:p>=0.5?'hol':null}}
  const p=Math.min(1,st.pOt*f);return {otPay:p*st.avgOt*h*1.5,meal:(+c.lunch||0)+p*(+c.otMeal||0),hours:p*st.avgOt,likely:st.pOt>=0.5?st.avgOt:null}}
function meCycleBase(S,k,todayStr,f){
  const c=S.cycles[k]||{},set=cfg(S,'me'),sal=salaryFor(S,k);
  const base={key:k,salary:sal,travel:set.travel};
  if(c.slip&&c.slip.gross){const s=c.slip;return Object.assign(base,{src:'slip',salary:+s.salary||sal,travel:+s.travel||0,otPay:+s.ot||0,meal:+s.meal||0,other:(+s.gross||0)-(+s.salary||0)-(+s.travel||0)-(+s.ot||0)-(+s.meal||0),gross:+s.gross,otActual:+s.ot||0,otExp:0,hours:c.actual?(c.actual.otHours+c.actual.holDays*8+(c.actual.h3||0)):null,hoursExp:0})}
  if(c.actual){const a=c.actual;const gross=a.salary+a.travel+a.otPay+a.meal;return Object.assign(base,{src:'file',salary:a.salary,travel:a.travel,otPay:a.otPay,meal:a.meal,other:0,gross,otActual:a.otPay,otExp:0,hours:a.otHours+a.holDays*8+(a.h3||0),hoursExp:0})}
  const st=meStats(S,k);let otA=0,otE=0,mealA=0,mealE=0,hA=0,hE=0,logged=0;
  const lk=Object.keys(c.days||{}).sort();const last=lk[lk.length-1]||'';
  for(const ds of datesIn(S,k)){const e=c.days&&c.days[ds];
    if(e){const r=meDay(S,e,sal);otA+=r.otPay;mealA+=r.meal;hA+=r.hours;logged++}
    else if(ds<=last&&isOffDay(S,'me',ds)){/* past day off, not worked */}
    else{const r=meExpected(S,ds,sal,st,f);otE+=r.otPay;mealE+=r.meal;hE+=r.hours}}
  const adj=0;
  const otPay=otA+otE,meal=mealA+mealE+adj;
  return Object.assign(base,{src:logged?'mixed':'forecast',otPay,meal,other:0,gross:sal+set.travel+otPay+meal,otActual:otA,otExp:otE,hours:hA,hoursExp:hE,logged})}
function thTax(n){const b=[[150000,0],[300000,.05],[500000,.10],[750000,.15],[1000000,.20],[2000000,.25],[5000000,.30],[Infinity,.35]];let t=0,prev=0;for(const [cap,r] of b){if(n>prev)t+=(Math.min(n,cap)-prev)*r;prev=cap}return t}
function meYear(S,y,todayStr,scn){
  const f=SCN[scn||'mid'],set=cfg(S,'me');
  const rows=yearKeys('me',y).map(k=>meCycleBase(S,k,todayStr,f));
  let gross=0,sal=0,ot=0,meal=0,other=0,pf=0,sso=0,loan=0,hours=0,otA=0,otE=0;
  for(const r of rows){const c=S.cycles[r.key]||{};const s=c.slip||{};
    r.pf=s.pf!=null&&s.gross?+s.pf:r.salary*set.pfRate/100;r.sso=s.sso!=null&&s.gross?+s.sso:set.sso;r.loan=s.loan!=null&&s.gross?+s.loan:set.loan;
    gross+=r.gross;sal+=r.salary;ot+=r.otPay;meal+=r.meal+r.travel+r.other;pf+=r.pf;sso+=r.sso;loan+=r.loan;hours+=(r.hours||0)+(r.hoursExp||0);otA+=r.otActual;otE+=r.otExp}
  const inc=gross+(+set.extraTaxable||0);
  const taxable=Math.max(0,inc-Math.min(inc*0.5,100000)-60000-sso-Math.min(pf,500000)-(+set.taxAllowance||0));
  const tax=thTax(taxable);
  let ytdKey=null,ytdTax=0;for(const r of rows){const s=(S.cycles[r.key]||{}).slip;if(s&&s.ytdTax!=null&&s.ytdTax!==''){ytdKey=r.key;ytdTax=+s.ytdTax}}
  const after=ytdKey?rows.filter(r=>r.key>ytdKey):rows;
  const perRest=after.length?Math.max(0,tax-ytdTax)/after.length:0;
  for(const r of rows){const s=(S.cycles[r.key]||{}).slip;
    if(s&&s.gross&&s.tax!=null&&s.tax!=='')r.tax=+s.tax;else if(!ytdKey||r.key>ytdKey)r.tax=perRest;else r.tax=tax/12;
    r.other_d=set.otherDeduct||0;
    r.net=s&&s.gross&&s.net?+s.net:r.gross-r.pf-r.sso-r.loan-r.tax-r.other_d}
  const ded=pf+sso+loan+tax+(set.otherDeduct||0)*12;
  return {rows,gross,sal,ot,meal,pf,sso,loan,tax,taxable,ded,net:gross-ded,hours,otA,otE,ytdTax,ytdKey}}

/* ---------- partner ---------- */
function ptDay(S,e,ds){const c=cfg(S,'partner'),h=c.wage/8,al=c.travel+c.meal+c.skill;const z={wage:0,ot:0,allow:0,hours:0,worked:0,base:0};
  if(!e)return null;
  if(e.s==='work'){const o=+e.ot||0;return {wage:c.wage,ot:o*h*c.ot15,allow:al,hours:o,worked:1,base:c.wage}}
  if(e.s==='hol'){const o=+e.ot||0;return {wage:c.wage*c.holMult,ot:o*h*c.ot3,allow:al,hours:o,worked:1,base:c.wage*c.holMult}}
  if(e.s==='off'&&holMap(S,'partner')[ds]&&c.paidHoliday)return Object.assign(z,{wage:c.wage,base:c.wage});
  return z}
function ptStats(S,curKey){const by=Array.from({length:7},()=>({n:0,w:0}));let otH=0,wk=0,cycles=0;
  for(let i=0;i<=6&&cycles<4;i++){const k=shiftKey(curKey,-i);const c=S.cycles[k];if(!c||!c.days)continue;let any=0;
    const keys=Object.keys(c.days).sort();const last=keys[keys.length-1];
    for(const ds of datesIn(S,k)){if(!last||ds>last)break;if(holMap(S,'partner')[ds])continue;const e=c.days[ds];const dw=parseD(ds).getDay();by[dw].n++;any++;
      if(e&&(e.s==='work'||e.s==='hol')){by[dw].w++;if(e.s==='work'){otH+=+e.ot||0;wk++}}}
    if(any)cycles++}
  const dflt=[0,1,1,1,1,1,0.4];
  return {p:by.map((b,i)=>b.n>=2?b.w/b.n:dflt[i]),avgOt:wk?otH/wk:1.9}}
function ptCycle(S,k,todayStr,f){
  const c=S.cycles[k]||{},set=cfg(S,'partner'),st=ptStats(S,k),hm=holMap(S,'partner'),al=set.travel+set.meal+set.skill,h=set.wage/8;
  let wageA=0,wageE=0,otA=0,otE=0,alA=0,alE=0,hA=0,hE=0,baseA=0,baseE=0,daysA=0,daysE=0,logged=0,lost=false;
  const lk=Object.keys(c.days||{}).sort();const last=lk[lk.length-1]||'';
  for(const ds of datesIn(S,k)){const e=c.days&&c.days[ds];
    if(!e&&ds<=last&&!hm[ds]&&st.p[parseD(ds).getDay()]<0.5)continue;
    if(e){const r=ptDay(S,e,ds);wageA+=r.wage;otA+=r.ot;alA+=r.allow;hA+=r.hours;baseA+=r.base;daysA+=r.worked;logged++;if((set.loseOn||[]).includes(e.s))lost=true}
    else if(hm[ds]){if(set.paidHoliday){wageE+=set.wage;baseE+=set.wage}}
    else{const p=st.p[parseD(ds).getDay()];wageE+=p*set.wage;baseE+=p*set.wage;alE+=p*al;otE+=p*st.avgOt*h*set.ot15*f;hE+=p*st.avgOt*f;daysE+=p}}
  let dil=lost?0:set.diligence;if(c.diligence==='yes')dil=set.diligence;if(c.diligence==='no')dil=0;
  const gross=wageA+wageE+otA+otE+alA+alE+dil;
  const sso=Math.min(set.ssoCap,(baseA+baseE)*set.ssoRate/100);
  return {key:k,src:logged?(daysE<0.01&&wageE===0?'actual':'mixed'):'forecast',wage:wageA+wageE,ot:otA+otE,otActual:otA,otExp:otE,allow:alA+alE,dil,lost,gross,sso,net:gross-sso,
    hours:hA,hoursExp:hE,days:daysA,daysExp:daysE,wageA,alA,logged}}
function ptYear(S,y,todayStr,scn){const f=SCN[scn||'mid'];const rows=yearKeys('partner',y).map(k=>ptCycle(S,k,todayStr,f));
  const sum=fn=>rows.reduce((a,r)=>a+fn(r),0);
  return {rows,gross:sum(r=>r.gross),wage:sum(r=>r.wage),ot:sum(r=>r.ot),allow:sum(r=>r.allow+r.dil),sso:sum(r=>r.sso),net:sum(r=>r.net),hours:sum(r=>r.hours+r.hoursExp),
    known:rows.filter(r=>r.logged).length}}

/* ---------- paste parser (time-attendance table) ---------- */
function parseAttendance(text,shiftEnd){
  const [eh,em]=(shiftEnd||'17:30').split(':').map(Number);const out=[];
  for(const raw of String(text).split(/\n/)){const line=raw.trim();const dm=line.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(!dm)continue;
    let y=+dm[3];if(y>2400)y-=543;const ds=`${y}-${pad(+dm[2])}-${pad(+dm[1])}`;
    const isWork=/วันทำงาน/.test(line);const isHol=!isWork&&/วันหยุด/.test(line);if(!isWork&&!isHol)continue;
    const comma=line.match(/(\d{1,2}):(\d{2})\s*,\s*(\d{1,2}):(\d{2})/);
    const pairs=[...line.matchAll(/(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})/g)];
    const hasCode=/(^|\s)H?D\s+\d{1,2}:\d{2}/.test(line);
    let act=comma||null;
    if(!act){if(pairs.length>=3)act=pairs[pairs.length-1];else if(!hasCode&&pairs.length)act=pairs[pairs.length-1]}
    let ot=0;if(act){const o=(+act[3])*60+(+act[4])-(eh*60+em);ot=o>0?Math.floor(o/30)*0.5:0}
    if(isWork)out.push({ds,e:{s:'work',ot}});else out.push({ds,e:act?{s:'hol',ot}:{s:'off'}});
  }
  return out}

/* ---------- OT hours by type (multiplier → hours) ---------- */
function meHrs(S,k,f){const c=S.cycles[k]||{},sal=salaryFor(S,k),h=sal/240;const o={a:{},e:{},b:{},hol:0,known:true,logged:false};
  const add=(t,m,hh)=>{if(!hh)return;o[t][m]=(o[t][m]||0)+hh;if(t==='a')o.b[m]=(o.b[m]||0)+hh*h*m};
  if(c.actual&&c.actual.otDays!=null){const a=c.actual;add('a',1,(a.holDays||0)*8);add('a',1.5,a.otHours||0);add('a',3,a.h3||0);o.hol=a.holDays||0;o.logged=true;return o}
  const st=meStats(S,k);const lk=Object.keys(c.days||{}).sort();const last=lk[lk.length-1]||'';const slip=!!(c.slip&&c.slip.gross);
  if(slip&&!lk.length){o.known=false;return o}
  for(const ds of datesIn(S,k)){const e=c.days&&c.days[ds];
    if(e){o.logged=true;if(e.s==='work')add('a',1.5,+e.ot||0);else if(e.s==='hol'){add('a',1,8);add('a',3,+e.ot||0);o.hol++}}
    else if(slip||(ds<=last&&isOffDay(S,'me',ds))){}
    else if(isOffDay(S,'me',ds)){const p=st.pHol*f;add('e',1,p*8);add('e',3,p*st.avgH3)}
    else add('e',1.5,Math.min(1,st.pOt*f)*st.avgOt)}
  return o}
function ptHrs(S,k,f){const c=S.cycles[k]||{},set=cfg(S,'partner'),h=set.wage/8,st=ptStats(S,k),hm=holMap(S,'partner');const o={a:{},e:{},b:{},hol:0,known:true,logged:false};
  const add=(t,m,hh,rate)=>{if(!hh)return;o[t][m]=(o[t][m]||0)+hh;if(t==='a')o.b[m]=(o.b[m]||0)+hh*rate};
  const lk=Object.keys(c.days||{}).sort();const last=lk[lk.length-1]||'';
  for(const ds of datesIn(S,k)){const e=c.days&&c.days[ds];
    if(e){o.logged=true;if(e.s==='work')add('a',set.ot15,+e.ot||0,h*set.ot15);else if(e.s==='hol'){add('a',set.holMult,8,h*set.holMult);add('a',set.ot3,+e.ot||0,h*set.ot3);o.hol++}}
    else if(hm[ds]||(ds<=last&&st.p[parseD(ds).getDay()]<0.5)){}
    else add('e',set.ot15,st.p[parseD(ds).getDay()]*st.avgOt*f)}
  return o}

/* ---------- storage: Google Sheets (Apps Script web app) or this device only ---------- */
const CONN='otb-conn',LOCAL='otb-data';
function readConn(){try{return JSON.parse(localStorage.getItem(CONN)||'null')}catch(e){return null}}
function writeConn(c){try{if(c)localStorage.setItem(CONN,JSON.stringify(c));else localStorage.removeItem(CONN)}catch(e){}}
function readLocal(){try{return JSON.parse(localStorage.getItem(LOCAL)||'null')||{settings:{},cycles:{}}}catch(e){return {settings:{},cycles:{}}}}
function writeLocal(){try{localStorage.setItem(LOCAL,JSON.stringify({settings:S.settings,cycles:S.cycles}))}catch(e){}}
const store={
  conn:readConn(),
  get mode(){return this.conn&&this.conn.u?'sheet':'local'},
  async load(conn){const c=conn||this.conn;if(!c||!c.u)return readLocal();
    const r=await fetch(c.u+(c.u.includes('?')?'&':'?')+'action=load&key='+encodeURIComponent(c.k||''),{cache:'no-store'});
    let j;try{j=await r.json()}catch(e){throw new Error('URL นี้ไม่ใช่ Web App ของ OT Board')}
    if(!j.ok)throw new Error(j.error==='key'?'รหัสเชื่อมต่อไม่ถูกต้อง':'โหลดข้อมูลไม่สำเร็จ');return j.docs||{settings:{},cycles:{}}},
  async set(coll,id,data){writeLocal();if(this.mode==='local')return;
    S.pending++;
    try{const r=await fetch(this.conn.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'set',key:this.conn.k,coll,id,data})});
      const j=await r.json();if(!j.ok)throw new Error(j.error==='key'?'รหัสเชื่อมต่อไม่ถูกต้อง':'บันทึกลง Google Sheets ไม่สำเร็จ');S.dbState='ok';S.lastSync=new Date()}
    catch(e){S.dbState='err';S.err=e.message&&/[ก-๙]/.test(e.message)?e.message:'ออฟไลน์อยู่ บันทึกไว้ในเครื่องก่อน';S.dirty=true;throw e}
    finally{S.pending--}}
};
async function uploadAll(){for(const [id,d] of Object.entries(S.settings))await store.set('settings',id,d);for(const [id,d] of Object.entries(S.cycles))await store.set('cycles',id,d)}
async function refresh(quiet){if(store.mode!=='sheet'||S.pending||S.sheet)return;
  try{if(S.dirty){await uploadAll();S.dirty=false}
    const d=await store.load();S.settings=d.settings||{};S.cycles=d.cycles||{};S.dbState='ok';S.lastSync=new Date();writeLocal();render()}
  catch(e){S.dbState='err';S.err=e.message&&/[ก-๙]/.test(e.message)?e.message:'เชื่อมต่อ Google Sheets ไม่ได้';if(!quiet)render()}}

async function saveSettings(p,obj,quiet){S.settings[p]=Object.assign({},cfg(S,p),obj);render();

function autoMode(p,ds){const e=getDay(S,p,ds);if(e)return e.s;const off=isOffDay(S,p,ds);return off?(p==='me'?'hol':'off'):'work'}
function dayMoney(p,ds,e){if(!e)return null;if(p==='me'){const sal=salaryFor(S,cycleOf(S,'me',parseD(ds)));const r=meDay(S,e,sal);return r.otPay+r.meal}const r=ptDay(S,e,ds);return r.wage+r.ot+r.allow}

/* ---------- calendar tab ---------- */
function calGrid(p,k){
  const ds=datesIn(S,k),c=S.cycles[k]||{},hm=holMap(S,p);const first=parseD(ds[0]);const lead=(first.getDay()+6)%7;
  const st=p==='me'?meStats(S,k):ptStats(S,k);const hasActual=!!(c.actual||(c.slip&&c.slip.gross));
  const lk=Object.keys(c.days||{}).sort();const last=lk[lk.length-1]||'';
  let h='';
  for(let i=0;i<lead;i++){const d=addDays(first,i-lead);h+=`<div class="cell blank" aria-hidden="true"><span class="n">${d.getDate()}</span></div>`}
  for(const x of ds){const d=parseD(x);const off=isOffDay(S,p,x);const e=c.days&&c.days[x];const hn=hm[x];
    let cls='cell',badge='';
    if(hn)cls+=' hd';else if(off)cls+=' off';
    if(e){
      if(p==='me'){if(e.s==='work')badge=+e.ot>0?`<span class="b">${hrs(+e.ot)}</span>`:'<span class="b z">–</span>';
        else if(e.s==='hol'){cls=cls.replace(' off','')+(hn?'':' hd');badge=`<span class="b h">1×${+e.ot>0?'+'+hrs(+e.ot):''}</span>`}
        else badge='<span class="b z">ลา</span>'}
      else{if(e.s==='work'||e.s==='hol'){cls=cls.replace(' off','')+' wk';badge=+e.ot>0?`<span class="b">${hrs(+e.ot)}</span>`:'<span class="b t">มา</span>';if(e.s==='hol')badge=`<span class="b h">หยุด${+e.ot>0?'+'+hrs(+e.ot):''}</span>`}
        else if(e.s==='sick')badge='<span class="b x">ป่วย</span>';else if(e.s==='leave')badge='<span class="b x">กิจ</span>';else badge=''}
    }else if(hn)badge='<span class="b hn">หยุด</span>';
    else if(!hasActual&&!(x<=last&&off)){
      if(p==='me'){const ex=meExpected(S,x,salaryFor(S,k),st,1);if(ex.likely==='hol')badge='<span class="b f">1×?</span>';else if(typeof ex.likely==='number')badge=`<span class="b f">${hrs(ex.likely)}</span>`}
      else{const pw=st.p[d.getDay()];if(pw>=0.5)badge=`<span class="b f">${st.avgOt>=0.5?hrs(st.avgOt):'มา'}</span>`}}
    if(x===TODAY)cls+=' today';
    const mo=d.getDate()===1||x===ds[0];
    h+=`<button type="button" class="${cls}" data-act="open" data-d="${x}" aria-label="${thDate(x)}${e?' · '+entryText(p,e):''}"><span class="n${mo?' mo':''}">${mo?d.getDate()+' '+TH_M[d.getMonth()]:d.getDate()}</span>${badge}</button>`}
  const end=parseD(ds[ds.length-1]);const tail=(7-((lead+ds.length)%7))%7;
  for(let i=1;i<=tail;i++){h+=`<div class="cell blank" aria-hidden="true"><span class="n">${addDays(end,i).getDate()}</span></div>`}
  const summaryOnly=hasActual&&!lk.length;
  return `<div class="dows"><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span><span>อา</span></div><div class="grid">${h}</div>
  ${summaryOnly?`<div class="note">รอบนี้มีแค่ยอดรวม${c.slip&&c.slip.gross?'จากสลิป':'จากไฟล์ Excel'} ไม่มีข้อมูลรายวัน</div>`:''}
  <div class="legend">${p==='me'?'<span><i class="sw" style="background:var(--me)"></i>OT ชม.</span><span><i class="sw" style="background:var(--hol)"></i>มาวันหยุด</span>':'<span><i class="sw" style="background:var(--pt-soft);border:1px solid var(--pt-mid)"></i>มาทำงาน</span><span><i class="sw" style="background:var(--pt)"></i>OT ชม.</span><span><i class="sw" style="background:var(--bad-soft)"></i>ลา</span>'}<span><i class="sw" style="border:1px dashed var(--ac-mid)"></i>คาดการณ์</span><span><i class="sw" style="background:var(--hol-soft);border:1px solid var(--hol-line)"></i>วันหยุดประเพณี</span></div>`}
function todayCard(p){

  const head=`<div class="row"><b style="font-size:16px">วันนี้ ${thDate(ds)}</b><span class="tiny muted">${hn?esc(hn):off?'วันหยุด':'วันทำงาน'}</span></div>`;

  <div class="tiny muted">แตะครั้งเดียวบันทึกเลย · แตะวันอื่นในปฏิทินเพื่อแก้ย้อนหลัง</div></section>`}

function sheetHTML(){if(!S.sheet)return '';if(S.sheet.ex)return exSheetHTML();const p=S.person,ds=S.sheet.d;const e=getDay(S,p,ds),off=isOffDay(S,p,ds),hn=holMap(S,p)[ds];

  case 'custom':{const ds=S.sheet.d;const v=num('cust');if(v==null||v<0||v>16){toast('ใส่ชั่วโมงระหว่าง 0–16');break}const mode=S.mode[p+ds]||autoMode(p,ds);const s=mode==='hol'?'hol':'work';const ot=Math.round(v*2)/2;
    await setDay(p,ds,{s,ot});const el=document.getElementById('cust');if(el)el.value='';toast(`บันทึก ${thDate(ds)} · ${entryText(p,{s,ot})}`);break}
  case 'saveoff':{const ds=S.sheet.d;await setDay(p,ds,{s:t.dataset.v});toast(`บันทึก ${thDate(ds)} · ${entryText(p,{s:t.dataset.v})}`);break}
  case 'clear':{const ds=S.sheet.d;delete S.mode[p+ds];await setDay(p,ds,null);toast('ล้างแล้ว');break}
  case 'dil':await saveCycle(t.dataset.k,c=>{if(t.dataset.v==='auto')delete c.diligence;else c.diligence=t.dataset.v});break;
  case 'pasteread':{const txt=(document.getElementById('paste')||{}).value||'';const items=parseAttendance(txt,'17:30');S.pasteRes={items};if(!items.length)toast('ไม่พบวันที่ในข้อมูลที่วาง');render();break}
  case 'pasteapply':{const items=(S.pasteRes||{}).items||[];const by={};for(const i of items){const k=cycleOf(S,'me',parseD(i.ds));(by[k]=by[k]||[]).push(i)}
    for(const [k,xs] of Object.entries(by))await saveCycle(k,c=>{for(const i of xs)c.days[i.ds]=i.e});S.pasteRes=null;const el=document.getElementById('paste');if(el)el.value='';toast(`นำเข้า ${items.length} วันแล้ว`);render();break}

  case 'slipsave':{const k=S.slipForm.k;const v={};for(const n of ['salary','travel','ot','meal','gross','pf','sso','loan','tax','net','vl','ytdIncome','ytdTax','ytdPf','ytdSso']){const x=num('sl-'+n);if(x!=null)v[n]=x}
    if(!v.gross&&v.salary!=null)v.gross=(v.salary||0)+(v.travel||0)+(v.ot||0)+(v.meal||0);S.slipForm=null;await saveCycle(k,c=>{c.slip=v});toast('บันทึกสลิปแล้ว');break}
  case 'slipdel':await saveCycle(t.dataset.k,c=>{delete c.slip});toast('ลบสลิปแล้ว');break;
  case 'exadd':{const name=((document.getElementById('ex-name')||{}).value||'').trim();const amt=num('ex-amt');if(!name||amt==null){toast('ใส่ชื่อรายการและจำนวนเงิน');break}
    const cat=document.getElementById('ex-cat').value,rec=document.getElementById('ex-rec').value==='1';const item={id:'x'+Date.now().toString(36),name,amount:amt,cat};if(rec)item.start=t.dataset.k;

    if(o.cycleStart!=null){if(o.cycleStart<1||o.cycleStart>27){toast('วันตัดรอบต้องอยู่ระหว่าง 1–27');break}o.cycleStart+=1}
    o.loseOn=document.getElementById('ps-lv').checked?['sick','leave']:['sick'];o.paidHoliday=document.getElementById('ps-ph').checked;await saveSettings('partner',o);break}

document.addEventListener('change',async ev=>{const t=ev.target;if(t.id!=='restore'||!t.files||!t.files[0])return;
  try{const d=JSON.parse(await t.files[0].text());if(!d||typeof d!=='object'||!d.cycles)throw 0;S.settings=d.settings||{};S.cycles=d.cycles||{};writeLocal();render();
    if(store.mode==='sheet')await uploadAll();toast(`นำเข้าแล้ว ${Object.keys(S.cycles).length} รอบ`)}catch(e){toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของ OT Board')}});
document.addEventListener('change',async ev=>{const t=ev.target;if(t.id!=='slipimg'||!t.files||!t.files[0]||!S.sample)return;const file=t.files[0];const k=selKey('me');
  S.slipBusy=true;render();
  try{const v=await S.sample.json('รูปนี้คือสลิปเงินเดือนภาษาไทย อ่านตัวเลขแล้วตอบเป็น JSON อย่างเดียว ใช้ตัวเลขล้วน (ไม่มีจุลภาค) ช่องที่ไม่มีให้เป็น null:\n{"salary":เงินเดือน,"travel":ค่าช่วยเหลือเดินทาง,"ot":ค่าล่วงเวลา,"meal":ค่าอาหาร,"gross":รวมรายได้,"pf":กองทุนสำรองเลี้ยงชีพ,"sso":ประกันสังคม,"loan":กองทุนกู้ยืมเพื่อการศึกษา,"tax":ภาษี,"net":ยอดสุทธิ,"vl":สิทธิพักร้อนคงเหลือ,"ytdIncome":รายได้สะสม,"ytdTax":ภาษีสะสม,"ytdPf":เงินสะสมกองทุน,"ytdSso":ประกันสังคมสะสม}',{images:file});
    const clean={};for(const [kk,x] of Object.entries(v||{})){if(x!=null&&!isNaN(Number(x)))clean[kk]=Number(x)}S.slipForm={k,v:clean,from:'img'}}
  catch(e){toast(e&&e.code==='not_granted'?'ไม่ได้อนุญาตให้อ่านรูป ใช้ “กรอกสลิปเอง” แทนได้':e&&e.code==='image_rejected'?'อ่านรูปนี้ไม่ได้ ลองรูปที่ชัดกว่า':'อ่านสลิปไม่สำเร็จ ลองอีกครั้งหรือกรอกเอง');if(e&&(e.code==='not_granted'||e.code==='sampling_disabled'))S.sample=null}
  S.slipBusy=false;render()});

(function(){const h=location.hash;if(h.startsWith('#connect=')){try{const c=JSON.parse(decodeURIComponent(escape(atob(h.slice(9)))));if(c&&c.u&&c.k){writeConn(c);store.conn=c;setTimeout(()=>toast('เชื่อมต่อ Google Sheets แล้ว'),300)}}catch(e){setTimeout(()=>toast('ลิงก์เชื่อมต่อไม่ถูกต้อง'),300)}
  try{history.replaceState(null,'',location.pathname+location.search+'#cal')}catch(e){location.hash='#cal'}S.tab='cal'}})();
{const c=readLocal();S.settings=c.settings||{};S.cycles=c.cycles||{};S.dbState=store.mode==='local'?'local':'loading'}
render();refresh();
setInterval(()=>{if(document.visibilityState==='visible')refresh(true)},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh(true)});
